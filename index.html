<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TimeBox</title>
        <link rel="stylesheet" href="./stayle.css" />
    </head>
    <body>
        <!-- Timer -->
        <div class="timer">
            <span id="time">25:00</span>
            <div>
                <button class="timer_icons"><img src="./icons/pause_icon.png" /></button>
                <button class="timer_icons"><img src="./icons/replay_icon-50.png" /></button>
            </div>
        </div>

        <!-- Bottom buttons -->
        <div class="timer_type">
            <button class="type">Focus</button>
            <button class="type">Short Break</button>
            <button class="type">Long Break</button>
            <button class="type">Timer</button>
        </div>

        <!-- Side buttons -->
        <nav>
            <button class="navType"><img src="./icons/goal_icon.png" alt="" />Gole</button>
            <button class="navType"><img src="./icons/sound_icon.png" alt="" />Sound</button>
            <button class="navType"><img src="./icons/img_icon.png" alt="" />Img</button>
            <button class="navType"><img src="./icons/note_icon.png" alt="" />Note</button>
            <button class="navType"><img src="./icons/ai_icon.png" alt="" />Ai</button>
        </nav>
        <script src="./script.js"></script>
    </body>
</html>
