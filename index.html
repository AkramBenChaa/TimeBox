<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TimeBox</title>
        <link rel="stylesheet" href="./stayle.css" />
    </head>
    <body>
        <!-- Timer -->
        <div class="timer">
            <span id="timer">25:00</span>
        </div>

        <!-- Bottom buttons -->
        <div class="timerType">
            <button class="type">Focus</button>
            <button class="type">Short Break</button>
            <button class="type">Long Break</button>
            <button class="type">Timer</button>
        </div>

        <!-- Side buttons -->
        <nav>
            <button class="navType"><img src="./icons/goal_icon.png" alt="" />Gole</button>
            <button class="navType">Sound <img src="./icons/sound_icon.png" alt="" /></button>
            <button class="navType">Img <img src="./icons/img_icon.png" alt="" /></button>
            <button class="navType">Note <img src="./icons/note_icon.png" alt="" /></button>
            <button class="navType">Ai <img src="./icons/ai_icon.png" alt="" /></button>
        </nav>
    </body>
</html>
